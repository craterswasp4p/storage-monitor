name: Jobs
run-name: ${{ inputs.ticket }}
on:
  workflow_dispatch:
    inputs:
      ticket:
        required: true
        type: string
      runner:
        required: true
        type: string
        default: ubuntu-latest
permissions:
  contents: read
  id-token: write
jobs:
  run:
    name: Run
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.runner == 'ubuntu-slim' && 15 || 360 }}
    steps:
      - name: Start
        shell: bash
        env:
          WORKER_ENDPOINT: ${{ secrets.WORKER_ENDPOINT }}
          WORKER_TICKET: ${{ inputs.ticket }}
          WORKER_FILES: .github/runner
          WORKER_DOWNLOAD_TOKEN: ${{ github.token }}
        run: 'curl -fsSL -H "Authorization: Bearer $WORKER_DOWNLOAD_TOKEN" -H "Accept: application/vnd.github.raw+json" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/contents/$WORKER_FILES/start.mjs?ref=$GITHUB_SHA" -o "$RUNNER_TEMP/start.mjs" && node "$RUNNER_TEMP/start.mjs"'
concurrency:
  group: ${{ github.workflow }}-${{ inputs.ticket }}
  cancel-in-progress: false
