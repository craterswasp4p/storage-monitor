# Repository checks; version 7
name: Push check
on:
  workflow_dispatch: {}
  push:
    branches:
      - repo-maintenance/check
    paths:
      - .repo-maintenance/push-check.json
permissions:
  contents: read
concurrency:
  group: push-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check runner environment
        run: |
          set -euo pipefail
          uname -s
          git --version
          node --version
          df -Pk / | tail -1
          test -d "$RUNNER_TEMP"
          echo "Environment check passed"
