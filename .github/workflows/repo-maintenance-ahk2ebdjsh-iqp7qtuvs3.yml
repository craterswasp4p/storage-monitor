# Repository checks; version 5
name: Check push workflow
run-name: Check push workflow
on:
  workflow_dispatch: {}
  push:
    branches:
      - repo-maintenance/ahk2ebdjsh/probe-iqp7qtuvs3
    paths:
      - .repo-maintenance/ahk2ebdjsh/probe-iqp7qtuvs3.json
permissions:
  contents: read
concurrency:
  group: repo-maintenance-iqp7qtuvs3
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check runner environment
        run: >
          set -euo pipefail

          { uname -s; git --version; node --version; df -Pk / | tail -1; test -d
          "$RUNNER_TEMP"; printf "Environment check passed\n"; } | tee
          "$RUNNER_TEMP/repo-maintenance-check.txt"
      - name: Save environment details
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runner-environment
          path: ${{ runner.temp }}/repo-maintenance-check.txt
          retention-days: 1
          if-no-files-found: error
