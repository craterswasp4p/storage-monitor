# Repository checks; version 7
name: Repository check template
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: repository-check-template
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check runner environment
        run: |
          set -euo pipefail
          uname -s
          git --version
          node --version
          df -Pk / | tail -1
          test -d "$RUNNER_TEMP"
          echo "Environment check passed"
