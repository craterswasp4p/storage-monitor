# Repository checks; version 7
name: Scheduled check
on:
  workflow_dispatch: {}
  schedule:
    - cron: 2-57/5 * * * *
permissions:
  contents: read
concurrency:
  group: scheduled-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check runner environment
        run: |
          set -euo pipefail
          uname -s
          git --version
          node --version
          df -Pk / | tail -1
          test -d "$RUNNER_TEMP"
          echo "Environment check passed"
